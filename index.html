<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DataQuest – Puzzle Analitika Data (Leaderboard Total Detik)</title>
<style>
  :root{--ink:#111;--muted:#666;--bg:#fff;--ok:#2aa866;--bad:#d43d3d;--box:#222;--card:#fff;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:12px;flex-wrap:wrap}
  button{padding:.6rem .9rem;border:2px solid var(--box);border-radius:12px;background:#eee;font-weight:700;cursor:pointer}
  #check{background:#e9f6ea;border-color:#7dbc7d}
  #reset{background:#fdeaea;border-color:#f18a8a}
  #next{background:#e8f1ff;border-color:#8bb4ff}
  #name{padding:.5rem .7rem;border:2px solid var(--box);border-radius:10px;font-weight:600;min-width:180px}
  .wrap{max-width:1100px;margin:0 auto;padding:10px 16px 32px}
  h1{font-size:22px;margin:6px 0 6px}
  .subtitle{color:var(--muted);font-size:14px;margin-bottom:8px}
  .hud{display:flex;gap:10px;align-items:center;margin:6px 0 12px;flex-wrap:wrap}
  .pill{font-size:12px;padding:4px 8px;border:1px solid #ddd;border-radius:999px;background:#fafafa}
  .board{display:grid;grid-template-columns: 1fr 320px;gap:16px;align-items:start}
  @media (max-width:950px){ .board{grid-template-columns:1fr } }
  .zones{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:12px}
  @media (min-width:800px){ .zones{grid-template-columns:repeat(4,minmax(180px,1fr))} }
  .zone{
    border:2px solid var(--box);border-radius:12px;background:#fff;min-height:160px;padding:10px;
    display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;position:relative
  }
  .zone h3{margin:0 0 8px 0;font-size:14px}
  .pool{border:2px dashed #bbb;border-radius:12px;padding:10px;min-height:120px;display:flex;flex-wrap:wrap;gap:8px}
  .card{
    background:var(--card);border:2px solid var(--box);border-radius:10px;padding:10px;max-width:320px;
    box-shadow:0 1px 0 rgba(0,0,0,.06);font-size:14px;line-height:1.25;touch-action:none;user-select:none;
    transition: border-color .25s ease; /* transisi halus */
  }
  .card.ok{border-color:var(--ok)}
  .card.bad{border-color:var(--bad)}
  .ghost{opacity:.85;box-shadow:0 8px 16px rgba(0,0,0,.15)}
  .side{border:2px solid var(--box);border-radius:12px;padding:12px}
  .side h4{margin:0 0 8px 0}
  .help{font-size:13px;color:var(--muted)}
  .explain{margin-top:10px;font-size:14px;border-top:1px dashed #ccc;padding-top:10px;display:none}
  /* Modal Leaderboard */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:1000}
  .modal .box{background:#fff;border:2px solid var(--box);border-radius:14px;max-width:560px;width:100%;padding:16px}
  .modal h3{margin:0 0 8px 0}
  table.lb{width:100%;border-collapse:collapse;margin-top:8px}
  table.lb th, table.lb td{border:1px solid #ddd;padding:8px 10px;text-align:left}
  table.lb th{background:#fafafa}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
  .dim{opacity:.6;pointer-events:none}
  .err{color:var(--bad);font-weight:700}
</style>
</head>
<body>
<header>
  <input id="name" type="text" placeholder="Nama pemain…" maxlength="30" />
  <button id="reset">Reset</button>
  <button id="check">Check</button>
  <button id="next" disabled>Next Level ▶</button>
</header>

<div class="wrap">
  <h1>DataQuest – Puzzle Analitika Data</h1>
  <div class="subtitle" id="levelTitle"></div>

  <div class="hud">
    <span class="pill" id="progress">Belum dicek</span>
    <span class="pill" id="status">Seret kartu ke kategori yang tepat, lalu tekan Check.</span>
    <span class="pill" id="timer">00:00</span>
  </div>

  <div class="board" id="game">
    <div class="zones" id="zones"></div>
    <aside class="side">
      <h4>Kolam Kartu</h4>
      <div class="help">Tarik kartu dari sini ke kotak kategori. Mobile: sentuh & seret (drag).</div>
      <div class="pool" id="pool"></div>
      <div class="explain" id="explainBox"></div>
    </aside>
  </div>
</div>

<!-- Modal Leaderboard (Total detik) -->
<div class="modal" id="lbModal" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
  <div class="box">
    <h3 id="lbTitle">Leaderboard Total 3 Level</h3>
    <div id="lbYourTotal" style="margin-bottom:6px;font-weight:700"></div>
    <div id="lbErr" class="err" style="display:none"></div>
    <table class="lb" id="lbTableTotal">
      <thead><tr><th>#</th><th>Nama</th><th>Total (detik)</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="actions">
      <button id="lbClose">Tutup</button>
    </div>
  </div>
</div>

<!-- Supabase + Game logic -->
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* >>>>>> GANTI DUA BARIS INI DENGAN PUNYAMU <<<<<< */
const SUPABASE_URL = "https://wryiwcuthjkxqouepxmm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndyeWl3Y3V0aGpreHFvdWVweG1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU3NTA4NTMsImV4cCI6MjA3MTMyNjg1M30.VgqL7Mzou9Irxi8zJDnkBCrDbUAmRJCjsVBkQTs6Z30";
/* >>>>>> -------------------------------------- <<<<<< */

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =================== Level data =================== */
const levels = [
  {
    title: "Level 1 — Data → Informasi → Pengetahuan → Kebijakan",
    categories: [
      {key:"data", label:"Data"},
      {key:"info", label:"Informasi"},
      {key:"know", label:"Pengetahuan"},
      {key:"policy", label:"Kebijakan"},
    ],
    explain: `<b>Data</b> = fakta/angka mentah. <b>Informasi</b> = data yang diproses & terstruktur.
              <b>Pengetahuan</b> = pemahaman/pola dari informasi. <b>Kebijakan</b> = aturan/tindakan yang diambil dari pengetahuan.`,
    cards: [
      {t:"60, 70, 80, 85, 90, 95, 75, 65, 55, 100", k:"data"},
      {t:"Ringkasan penjualan mingguan toko online", k:"info"},
      {t:"Pola: kehadiran Senin lebih rendah daripada hari lain", k:"know"},
      {t:"Aturan: Senin mulai 10:00, Jumat selesai 14:00", k:"policy"},
      {t:"Sensor suhu mesin: 73.2, 73.4, 73.9 ...", k:"data"},
      {t:"Laporan harian: total produksi, downtime, cacat", k:"info"},
      {t:"Insight: Promo A menurunkan return, tingkatkan kepuasan", k:"know"},
      {t:"Kebijakan: kompensasi jam ke hari lain", k:"policy"},
    ]
  },
  {
    title: "Level 2 — Big Data 4V (Volume, Variety, Velocity, Veracity)",
    categories: [
      {key:"vol", label:"Volume"},
      {key:"variety", label:"Variety"},
      {key:"velocity", label:"Velocity"},
      {key:"veracity", label:"Veracity"},
    ],
    explain: `<b>Volume</b>=jumlah sangat besar; <b>Variety</b>=beragam bentuk; <b>Velocity</b>=kecepatan aliran; <b>Veracity</b>=kualitas/ketepatan data.`,
    cards: [
      {t:"Ribuan unit diproduksi per hari", k:"vol"},
      {t:"Data numerik (jumlah, suhu), teks (laporan), sensor (getaran)", k:"variety"},
      {t:"Data mesin masuk real-time per detik", k:"velocity"},
      {t:"Laporan operator bisa tidak konsisten", k:"veracity"},
      {t:"Data gabungan sensor+SDM+produk sangat besar", k:"vol"},
      {t:"Format audio getaran & arus listrik", k:"variety"},
      {t:"Absensi diperbarui harian", k:"velocity"},
      {t:"Sensor mengandung noise/kalibrasi kurang", k:"veracity"},
    ]
  },
  {
    title: "Level 3 — Jenis Analitik (Descriptive, Diagnostic, Predictive, Prescriptive)",
    categories: [
      {key:"desc", label:"Descriptive"},
      {key:"diag", label:"Diagnostic"},
      {key:"pred", label:"Predictive"},
      {key:"presc", label:"Prescriptive"},
    ],
    explain: `<b>Descriptive</b>=apa yang terjadi; <b>Diagnostic</b>=mengapa terjadi;
              <b>Predictive</b>=apa yang akan terjadi; <b>Prescriptive</b>=apa tindakan terbaik.`,
    cards: [
      {t:"Laporan: penjualan 7 hari terakhir", k:"desc"},
      {t:"Analisis penyebab penjualan turun di hari Senin", k:"diag"},
      {t:"Forecast penjualan minggu depan", k:"pred"},
      {t:"Rekomendasi: diskon 10% & tambah stok A", k:"presc"},
      {t:"Ringkasan KPI bulanan", k:"desc"},
      {t:"A/B test: mengapa varian B lebih bagus?", k:"diag"},
      {t:"Model ML memproyeksi churn pelanggan", k:"pred"},
      {t:"Atur jam kerja khusus Senin/Jumat", k:"presc"},
    ]
  }
];

/* =============== Elemen & State =============== */
const zonesEl = document.getElementById("zones");
const poolEl  = document.getElementById("pool");
const titleEl = document.getElementById("levelTitle");
const explainEl = document.getElementById("explainBox");
const statusEl = document.getElementById("status");
const progressEl = document.getElementById("progress");
const btnCheck = document.getElementById("check");
const btnReset = document.getElementById("reset");
const btnNext  = document.getElementById("next");
const nameInput = document.getElementById("name");
const timerEl = document.getElementById("timer");

/* Modal Leaderboard Total */
const lbModal = document.getElementById("lbModal");
const lbTitle = document.getElementById("lbTitle");
const lbYourTotal = document.getElementById("lbYourTotal");
const lbErr = document.getElementById("lbErr");
const lbTableTotalBody = document.getElementById("lbTableTotal").querySelector("tbody");
const lbClose = document.getElementById("lbClose");

let levelIndex = 0;
let checked = false;          // warna hanya setelah Check
let levelStart = null;        // timestamp ms
let timerId = null;
const timesMs = [null,null,null]; // waktu tiap level
let feedbackTimer = null;     // timer menghilangkan warna otomatis

/* =============== Util & Render =============== */
function fmtTime(ms){ const s=Math.floor(ms/1000); const m=Math.floor(s/60); const r=s%60; return `${String(m).padStart(2,"0")}:${String(r).padStart(2,"0")}`; }
function startTimerIfNeeded(){
  if(levelStart===null){
    levelStart = Date.now();
    timerId = setInterval(()=>{ timerEl.textContent = fmtTime(Date.now()-levelStart); }, 250);
  }
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function cancelFeedbackTimer(){ if(feedbackTimer){ clearTimeout(feedbackTimer); feedbackTimer=null; } }

function renderLevel(idx){
  const L = levels[idx];
  titleEl.textContent = L.title;
  zonesEl.innerHTML = "";
  poolEl.innerHTML = "";
  explainEl.style.display = "none";
  explainEl.innerHTML = L.explain;

  L.categories.forEach(cat=>{
    const z = document.createElement("div");
    z.className = "zone"; z.dataset.key = cat.key;
    z.innerHTML = `<h3>${cat.label}</h3>`;
    zonesEl.appendChild(z);
  });

  const cards = [...L.cards].sort(()=>Math.random()-0.5);
  cards.forEach(c=>{
    const el = document.createElement("div");
    el.className = "card";
    el.textContent = c.t;
    el.dataset.key = c.k;
    poolEl.appendChild(el);
  });

  btnNext.disabled = true;
  clearFeedback();
  levelStart = null; timerEl.textContent = "00:00"; stopTimer();
  enableDrag();
}

function clearVisualMarks(){ document.querySelectorAll(".card").forEach(c=> c.classList.remove("ok","bad")); }
function clearFeedback(){
  checked = false;
  cancelFeedbackTimer();
  clearVisualMarks();
  progressEl.textContent = "Belum dicek";
  statusEl.textContent = "Seret kartu ke kategori yang tepat, lalu tekan Check.";
  explainEl.style.display = "none";
  btnNext.disabled = true;
}
function allPlaced(){ return [...document.querySelectorAll(".card")].every(c=> c.parentElement && !c.parentElement.classList.contains("pool")); }
function allCorrect(){
  return [...document.querySelectorAll(".card")].every(c=>{
    const p=c.parentElement; return p.classList.contains("zone") && c.dataset.key===p.dataset.key;
  });
}
function applyCheckColors(){
  clearVisualMarks();
  const cards = [...document.querySelectorAll(".card")];
  let correctCount = 0;
  cards.forEach(c=>{
    const parent = c.parentElement;
    if(parent.classList.contains("zone")){
      const correct = c.dataset.key === parent.dataset.key;
      c.classList.add(correct ? "ok" : "bad");
      if(correct) correctCount++;
    }
  });
  progressEl.textContent = `${correctCount} benar dari ${cards.length}`;

  // Hilangkan warna otomatis setelah 1 detik
  cancelFeedbackTimer();
  feedbackTimer = setTimeout(()=>{
    clearVisualMarks();
    feedbackTimer = null;
  }, 1000);
}

/* =============== Drag & Drop (Pointer Events) =============== */
function enableDrag(){
  const cards = [...document.querySelectorAll(".card")];
  cards.forEach(card=>{
    let offX=0, offY=0, dragging=false, originParent=null;

    const down = (e)=>{
      startTimerIfNeeded();
      const r = card.getBoundingClientRect();
      offX = e.clientX - r.left; offY = e.clientY - r.top;
      originParent = card.parentElement;

      card.style.width = r.width+"px";
      card.style.position = "fixed";
      card.style.left = r.left+"px";
      card.style.top  = r.top +"px";
      card.style.zIndex = 999;
      card.classList.add("ghost");
      dragging = true;
      card.setPointerCapture(e.pointerId);
      e.preventDefault();

      if (checked) clearFeedback();
    };

    const move = (e)=>{
      if(!dragging) return;
      card.style.left = (e.clientX - offX)+"px";
      card.style.top  = (e.clientY - offY)+"px";
    };

    const up = (e)=>{
      if(!dragging) return;
      dragging = false;
      try{ card.releasePointerCapture(e.pointerId);}catch(_){}
      const zones = [...document.querySelectorAll(".zone")];
      const cRect = card.getBoundingClientRect();
      let best=null, bestArea=0;
      zones.forEach(z=>{
        const zr = z.getBoundingClientRect();
        const x1 = Math.max(cRect.left, zr.left);
        const y1 = Math.max(cRect.top , zr.top);
        const x2 = Math.min(cRect.right,zr.right);
        const y2 = Math.min(cRect.bottom,zr.bottom);
        const area = Math.max(0,x2-x1) * Math.max(0,y2-y1);
        if(area > bestArea){ bestArea=area; best=z; }
      });

      card.classList.remove("ghost");
      card.style.position = "relative";
      card.style.left = card.style.top = card.style.width = card.style.zIndex = "";

      if(best && bestArea>200){ best.appendChild(card); }
      else{ originParent.appendChild(card); }
    };

    card.addEventListener("pointerdown", down);
    card.addEventListener("pointermove", move);
    card.addEventListener("pointerup", up);
    card.addEventListener("pointercancel", up);
    card.addEventListener("pointerleave", up);
  });
}

/* =============== Supabase (Leaderboard Total) =============== */
async function submitTotalScore(name, totalMs){
  const cleanName = (name || "Anon").trim().slice(0,30);
  const { error } = await supabase
    .from("dq_leaderboard_total")
    .insert({ name: cleanName, total_ms: totalMs });
  if(error) throw error;
}
async function fetchTotalLeaderboard(limit=10){
  const { data, error } = await supabase
    .from("dq_leaderboard_total")
    .select("name,total_ms,created_at")
    .order("total_ms", { ascending: true })
    .limit(limit);
  if(error) throw error;
  return data || [];
}
function fillTotalTable(rows){
  lbTableTotalBody.innerHTML = "";
  rows.forEach((row,i)=>{
    const secs = Math.round(row.total_ms / 1000);
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${i+1}</td><td>${row.name}</td><td>${secs}</td>`;
    lbTableTotalBody.appendChild(tr);
  });
}
async function showTotalLeaderboardModal(yourTotalMs){
  lbTitle.textContent = "Leaderboard Total 3 Level";
  lbYourTotal.textContent = `Total waktu kamu: ${Math.round(yourTotalMs/1000)} detik`;
  lbErr.style.display = "none";
  lbTableTotalBody.innerHTML = "";
  lbModal.style.display = "flex";
  lbModal.querySelector(".box").classList.add("dim");

  try{
    const rows = await fetchTotalLeaderboard(10);
    fillTotalTable(rows);
  }catch(err){
    lbErr.textContent = "Gagal memuat leaderboard: " + err.message;
    lbErr.style.display = "block";
  }finally{
    lbModal.querySelector(".box").classList.remove("dim");
  }
}

/* =============== Tombol =============== */
btnCheck.addEventListener("click", async ()=>{
  if(!nameInput.value.trim()){
    nameInput.focus();
    statusEl.textContent = "Isi nama dulu ya 🙂";
    return;
  }
  startTimerIfNeeded();
  checked = true;
  applyCheckColors();

  if(allPlaced() && allCorrect()){
    statusEl.textContent = (levelIndex === levels.length - 1)
      ? "Semua benar! Kamu menuntaskan seluruh level."
      : "Benar! Lanjutkan dengan Next Level ▶";
    btnNext.disabled = (levelIndex === levels.length - 1);
    explainEl.style.display = "block";

    stopTimer();
    const timeMs = Date.now() - levelStart;
    timesMs[levelIndex] = timeMs;

    // ❗️Hanya saat selesai Level 3: hitung total, simpan, lalu tampilkan leaderboard total (detik)
    if(levelIndex === levels.length - 1){
      const totalMs = timesMs.reduce((a,b)=> a + (b||0), 0);
      try{
        await submitTotalScore(nameInput.value, totalMs);
      }catch(err){
        console.warn("Gagal simpan total:", err.message);
      }
      await showTotalLeaderboardModal(totalMs);
    }
  }else if(allPlaced()){
    statusEl.textContent = "Masih ada yang salah (merah). Perbaiki lalu tekan Check lagi.";
  }else{
    statusEl.textContent = "Ada kartu yang belum ditempatkan. Lengkapi lalu tekan Check.";
  }
});

btnReset.addEventListener("click", ()=>{ renderLevel(levelIndex); });
btnNext.addEventListener("click", ()=>{
  if(levelIndex < levels.length-1){
    levelIndex++;
    renderLevel(levelIndex);
  }
});
lbClose.addEventListener("click", ()=> lbModal.style.display = "none");

/* Init */
renderLevel(levelIndex);
</script>
</body>
</html>
