<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DataQuest – Puzzle Analitika Data</title>
<style>
  :root{--ink:#111;--muted:#666;--bg:#fff;--ok:#2aa866;--bad:#d43d3d;--box:#222;--card:#fff;--accent:#f5c82d;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;gap:10px;justify-content:flex-end;padding:12px}
  button{padding:.6rem .9rem;border:2px solid var(--box);border-radius:12px;background:#eee;font-weight:700;cursor:pointer}
  #check{background:#e9f6ea;border-color:#7dbc7d}
  #reset{background:#fdeaea;border-color:#f18a8a}
  #next{background:#e8f1ff;border-color:#8bb4ff}
  .wrap{max-width:1100px;margin:0 auto;padding:10px 16px 32px}
  h1{font-size:22px;margin:6px 0 6px}
  .subtitle{color:var(--muted);font-size:14px;margin-bottom:8px}
  .hud{display:flex;gap:10px;align-items:center;margin:6px 0 12px}
  .pill{font-size:12px;padding:4px 8px;border:1px solid #ddd;border-radius:999px;background:#fafafa}
  .board{display:grid;grid-template-columns: 1fr 320px;gap:16px;align-items:start}
  @media (max-width:950px){ .board{grid-template-columns:1fr} }
  /* Zones & pool */
  .zones{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:12px}
  @media (min-width:800px){ .zones{grid-template-columns:repeat(4,minmax(180px,1fr))} }
  .zone{
    border:2px solid var(--box);border-radius:12px;background:#fff;min-height:160px;padding:10px;
    display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;position:relative
  }
  .zone h3{margin:0 0 8px 0;font-size:14px}
  .pool{border:2px dashed #bbb;border-radius:12px;padding:10px;min-height:120px;display:flex;flex-wrap:wrap;gap:8px}
  /* Cards */
  .card{
    background:var(--card);border:2px solid var(--box);border-radius:10px;padding:10px;max-width:320px;
    box-shadow:0 1px 0 rgba(0,0,0,.06);font-size:14px;line-height:1.25;touch-action:none;user-select:none
  }
  .card.ok{border-color:var(--ok)}
  .card.bad{border-color:var(--bad)}
  .ghost{opacity:.85;box-shadow:0 8px 16px rgba(0,0,0,.15)}
  /* Side panel */
  .side{border:2px solid var(--box);border-radius:12px;padding:12px}
  .side h4{margin:0 0 8px 0}
  .help{font-size:13px;color:var(--muted)}
  .explain{margin-top:10px;font-size:14px;border-top:1px dashed #ccc;padding-top:10px;display:none}
  /* Drag surface */
  #game{position:relative}
</style>
</head>
<body>
<header>
  <button id="reset">Reset</button>
  <button id="check">Check</button>
  <button id="next" disabled>Next Level ▶</button>
</header>

<div class="wrap">
  <h1>DataQuest – Puzzle Analitika Data</h1>
  <div class="subtitle" id="levelTitle"></div>

  <div class="hud">
    <span class="pill" id="progress">0 benar</span>
    <span class="pill" id="status">Seret kartu ke kategori yang tepat.</span>
  </div>

  <div class="board" id="game">
    <div class="zones" id="zones"></div>
    <aside class="side">
      <h4>Kolam Kartu</h4>
      <div class="help">Tarik kartu dari sini ke kotak kategori. Mobile: sentuh & seret (drag).</div>
      <div class="pool" id="pool"></div>
      <div class="explain" id="explainBox"></div>
    </aside>
  </div>
</div>

<script>
/* ---------- Level data (berdasarkan materi kuliah) ---------- */
const levels = [
  {
    title: "Level 1 — Susun Tingkatan: Data → Informasi → Pengetahuan → Kebijakan",
    categories: [
      {key:"data", label:"Data"},
      {key:"info", label:"Informasi"},
      {key:"know", label:"Pengetahuan"},
      {key:"policy", label:"Kebijakan"},
    ],
    explain: `
      <b>Data</b> = fakta/angka mentah. <b>Informasi</b> = data yang diproses & terstruktur.
      <b>Pengetahuan</b> = pemahaman/pola dari informasi. <b>Kebijakan</b> = aturan/tindakan yang diambil dari pengetahuan.
    `,
    cards: [
      {t:"60, 70, 80, 85, 90, 95, 75, 65, 55, 100", k:"data"},
      {t:"Ringkasan penjualan mingguan toko online", k:"info"},
      {t:"Pola: kehadiran Senin lebih rendah daripada hari lain", k:"know"},
      {t:"Aturan: Senin mulai 10:00, Jumat selesai 14:00", k:"policy"},
      {t:"Sensor suhu mesin: 73.2, 73.4, 73.9 ...", k:"data"},
      {t:"Laporan harian: total produksi, downtime, cacat", k:"info"},
      {t:"Insight: Promo A menurunkan return, tingkatkan kepuasan", k:"know"},
      {t:"Kebijakan: kompensasi jam ke hari lain", k:"policy"},
    ]
  },
  {
    title: "Level 2 — Klasifikasi Big Data 4V (Volume, Variety, Velocity, Veracity)",
    categories: [
      {key:"vol", label:"Volume"},
      {key:"variety", label:"Variety"},
      {key:"velocity", label:"Velocity"},
      {key:"veracity", label:"Veracity"},
    ],
    explain: `
      <b>Volume</b>=jumlah sangat besar; <b>Variety</b>=beragam bentuk; <b>Velocity</b>=kecepatan aliran; <b>Veracity</b>=kualitas/ketepatan data.
    `,
    cards: [
      {t:"Ribuan unit diproduksi per hari", k:"vol"},
      {t:"Data numerik (jumlah, suhu), teks (laporan), sensor (getaran)", k:"variety"},
      {t:"Data mesin masuk real-time per detik", k:"velocity"},
      {t:"Laporan operator bisa tidak konsisten", k:"veracity"},
      {t:"Data gabungan sensor+SDM+produk sangat besar", k:"vol"},
      {t:"Format audio getaran & arus listrik", k:"variety"},
      {t:"Absensi diperbarui harian", k:"velocity"},
      {t:"Sensor mengandung noise/kalibrasi kurang", k:"veracity"},
    ]
  },
  {
    title: "Level 3 — Cocokkan Jenis Analitik (D, Di, P, Pr)",
    categories: [
      {key:"desc", label:"Descriptive"},
      {key:"diag", label:"Diagnostic"},
      {key:"pred", label:"Predictive"},
      {key:"presc", label:"Prescriptive"},
    ],
    explain: `
      <b>Descriptive</b>=apa yang terjadi; <b>Diagnostic</b>=mengapa terjadi;
      <b>Predictive</b>=apa yang akan terjadi; <b>Prescriptive</b>=apa tindakan terbaik.
    `,
    cards: [
      {t:"Laporan: penjualan 7 hari terakhir", k:"desc"},
      {t:"Analisis penyebab penjualan turun di hari Senin", k:"diag"},
      {t:"Forecast penjualan minggu depan", k:"pred"},
      {t:"Rekomendasi: diskon 10% & tambah stok A", k:"presc"},
      {t:"Ringkasan KPI bulanan", k:"desc"},
      {t:"A/B test: mengapa varian B lebih bagus?", k:"diag"},
      {t:"Model ML memproyeksi churn pelanggan", k:"pred"},
      {t:"Atur jam kerja khusus Senin/Jumat", k:"presc"},
    ]
  }
];

/* ---------- Render UI ---------- */
const zonesEl = document.getElementById("zones");
const poolEl  = document.getElementById("pool");
const titleEl = document.getElementById("levelTitle");
const explainEl = document.getElementById("explainBox");
const statusEl = document.getElementById("status");
const progressEl = document.getElementById("progress");
const btnCheck = document.getElementById("check");
const btnReset = document.getElementById("reset");
const btnNext  = document.getElementById("next");

let levelIndex = 0;
function renderLevel(idx){
  const L = levels[idx];
  titleEl.textContent = L.title;
  zonesEl.innerHTML = "";
  poolEl.innerHTML = "";
  explainEl.style.display = "none";
  explainEl.innerHTML = L.explain;

  // Zones
  L.categories.forEach(cat=>{
    const z = document.createElement("div");
    z.className = "zone"; z.dataset.key = cat.key;
    z.innerHTML = `<h3>${cat.label}</h3>`;
    zonesEl.appendChild(z);
  });

  // Shuffle cards
  const cards = [...L.cards].sort(()=>Math.random()-0.5);
  cards.forEach(c=>{
    const el = document.createElement("div");
    el.className = "card";
    el.textContent = c.t;
    el.dataset.key = c.k;
    poolEl.appendChild(el);
  });

  btnNext.disabled = true;
  updateProgress();
  statusEl.textContent = "Seret kartu ke kategori yang tepat.";
  enableDrag();
}
renderLevel(levelIndex);

/* ---------- Drag & drop (Pointer Events) ---------- */
function enableDrag(){
  const cards = [...document.querySelectorAll(".card")];
  cards.forEach(card=>{
    let startX=0, startY=0, offX=0, offY=0, dragging=false, originParent=null;

    const down = (e)=>{
      const r = card.getBoundingClientRect();
      startX = e.clientX; startY = e.clientY;
      offX = e.clientX - r.left; offY = e.clientY - r.top;
      originParent = card.parentElement;

      card.style.width = r.width+"px";
      card.style.position = "fixed";
      card.style.left = r.left+"px";
      card.style.top  = r.top +"px";
      card.style.zIndex = 999;
      card.classList.add("ghost");
      dragging = true;
      card.setPointerCapture(e.pointerId);
      e.preventDefault();
    };

    const move = (e)=>{
      if(!dragging) return;
      card.style.left = (e.clientX - offX)+"px";
      card.style.top  = (e.clientY - offY)+"px";
    };

    const up = (e)=>{
      if(!dragging) return;
      dragging = false;
      try{ card.releasePointerCapture(e.pointerId);}catch(_){}
      // find best zone overlap
      const zones = [...document.querySelectorAll(".zone")];
      const cRect = card.getBoundingClientRect();
      let best=null, bestArea=0;
      zones.forEach(z=>{
        const zr = z.getBoundingClientRect();
        const x1 = Math.max(cRect.left, zr.left);
        const y1 = Math.max(cRect.top , zr.top);
        const x2 = Math.min(cRect.right,zr.right);
        const y2 = Math.min(cRect.bottom,zr.bottom);
        const area = Math.max(0,x2-x1) * Math.max(0,y2-y1);
        if(area > bestArea){ bestArea=area; best=z; }
      });

      // snap
      card.classList.remove("ghost");
      card.style.position = "relative";
      card.style.left = card.style.top = card.style.width = card.style.zIndex = "";

      if(best && bestArea>200){ best.appendChild(card); }
      else{ originParent.appendChild(card); }

      // auto-check coloring (without message)
      updateColors(false);
      updateProgress();
      // if all correct -> enable next & show explain
      if(allPlaced() && allCorrect()){
        statusEl.textContent = "Bagus! Semua benar 🚀";
        btnNext.disabled = false;
        explainEl.style.display = "block";
      }
    };

    card.addEventListener("pointerdown", down);
    card.addEventListener("pointermove", move);
    card.addEventListener("pointerup", up);
    card.addEventListener("pointercancel", up);
    card.addEventListener("pointerleave", up);
  });
}

function updateColors(showMsg){
  const cards = [...document.querySelectorAll(".card")];
  cards.forEach(c=>{
    c.classList.remove("ok","bad");
    const parent = c.parentElement;
    if(parent.classList.contains("zone")){
      const correct = c.dataset.key === parent.dataset.key;
      c.classList.add(correct ? "ok" : "bad");
    }
  });
  if(showMsg){
    if(allPlaced() && allCorrect()){
      statusEl.textContent = "Semua benar! Lanjut ke Next Level.";
      btnNext.disabled = false;
      explainEl.style.display = "block";
    }else if(allPlaced()){
      statusEl.textContent = "Masih ada yang salah (merah). Coba perbaiki!";
    }else{
      statusEl.textContent = "Ada kartu yang belum ditempatkan.";
    }
  }
}
function allPlaced(){
  return [...document.querySelectorAll(".card")].every(c=> c.parentElement && !c.parentElement.classList.contains("pool"));
}
function allCorrect(){
  return [...document.querySelectorAll(".card")].every(c=>{
    const p=c.parentElement; return p.classList.contains("zone") && c.dataset.key===p.dataset.key;
  });
}
function updateProgress(){
  const total = document.querySelectorAll(".card").length;
  const ok = document.querySelectorAll(".card.ok").length;
  progressEl.textContent = `${ok} benar dari ${total}`;
}

/* ---------- Buttons ---------- */
document.getElementById("check").addEventListener("click", ()=>{
  updateColors(true);
  updateProgress();
});
document.getElementById("reset").addEventListener("click", ()=>{
  renderLevel(levelIndex);
});
document.getElementById("next").addEventListener("click", ()=>{
  if(levelIndex < levels.length-1){
    levelIndex++;
    renderLevel(levelIndex);
  }else{
    statusEl.textContent = "🎉 Selesai! Kamu menuntaskan semua level.";
    btnNext.disabled = true;
  }
});
</script>
</body>
</html>
